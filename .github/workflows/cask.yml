name: Verify ProxyBear release

on:
  push:
    branches: [main]
    paths:
      - Casks/proxybear.rb

permissions:
  contents: read

concurrency:
  group: cask-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cask:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Verify cask and install the app
        run: |
          brew tap msdx321/tap "$GITHUB_WORKSPACE"
          brew style msdx321/tap/proxybear
          brew audit --cask --strict msdx321/tap/proxybear
          brew install --cask msdx321/tap/proxybear
          test -d /Applications/ProxyBear.app
          codesign --verify --deep --strict /Applications/ProxyBear.app
          brew uninstall --cask msdx321/tap/proxybear
