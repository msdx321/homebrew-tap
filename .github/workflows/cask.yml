name: Update and verify cask

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: cask-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cask:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

      - name: Update from the latest release
        id: update
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          uv run --no-project --python 3.13 .github/scripts/update-proxybear.py
          if git diff --quiet -- Casks/proxybear.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify cask and install the app
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        run: |
          brew tap msdx321/tap "$GITHUB_WORKSPACE"
          # Include an uncommitted release update in the local tap used for verification.
          cp Casks/proxybear.rb "$(brew --repository msdx321/tap)/Casks/proxybear.rb"
          brew style msdx321/tap/proxybear
          brew audit --cask --strict msdx321/tap/proxybear
          brew install --cask msdx321/tap/proxybear
          test -d /Applications/ProxyBear.app
          codesign --verify --deep --strict /Applications/ProxyBear.app
          brew uninstall --cask msdx321/tap/proxybear

      - name: Commit verified release update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/proxybear.rb
          git commit -m 'chore(cask): update ProxyBear release'
          git push
